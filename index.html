<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0"
    />
    <meta
      name="description"
      content="Catálogo público provisório da Yumi Studio com produtos de impressão 3D sob encomenda."
    />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Yumi Studio - Catálogo</title>
    <script>
      (() => {
        // Keep in sync with src/hooks/useTheme.ts.
        let theme = "light";
        try {
          const storedTheme = localStorage.getItem("yumi-theme-choice");
          if (storedTheme === "light" || storedTheme === "dark") {
            theme = storedTheme;
          } else if (matchMedia("(prefers-color-scheme: dark)").matches) {
            theme = "dark";
          }
        } catch {
          // Falls back to light.
        }
        document.documentElement.classList.toggle("dark", theme === "dark");
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
